name: Governance

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
  issues:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  pull-request-label:
    if: github.event_name == 'pull_request_target'
    name: Required PR label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Verify pull request label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          label_count="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels | length')"
          if [[ "$label_count" -eq 0 ]]; then
            echo "pull request requires at least one label" >&2
            exit 1
          fi

  contributor-review:
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review'
    name: Required contributor review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Verify contributor review
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$AUTHOR" == "$OWNER" ]]; then
            exit 0
          fi
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              const latest = new Map();
              for (const review of JSON.parse(raw)) {
                if (review.user?.login !== process.env.AUTHOR && review.commit_id === process.env.HEAD_SHA) {
                  latest.set(review.user.login, review.state);
                }
              }
              if (![...latest.values()].includes("APPROVED")) {
                console.error("third-party pull request requires an approval");
                process.exitCode = 1;
              }
            });
          '

  issue-label:
    if: github.event_name == 'issues'
    name: Apply issue triage label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Apply triage label when needed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          label_count="$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json labels --jq '.labels | length')"
          if [[ "$label_count" -eq 0 ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-label needs-triage
          fi
