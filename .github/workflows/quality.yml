name: Quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      pr_title:
        required: false
        type: string
        default: ""
      pr_author_type:
        required: false
        type: string
        default: ""
      pr_labels:
        required: false
        type: string
        default: ""
      checkout_ref:
        required: false
        type: string
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Required quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Run quality checks
        run: npm run check

      - name: Run plugin documentation gate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_TITLE: ${{ github.event.pull_request.title || inputs.pr_title }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || inputs.pr_author_type }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') || inputs.pr_labels }}
        run: |
          set -euo pipefail
          gate_dir="$RUNNER_TEMP/release-documentation-gate"
          mkdir -p "$gate_dir"
          git fetch origin main
          git show origin/main:scripts/documentation-gate.cjs > "$gate_dir/documentation-gate.cjs"
          git show origin/main:scripts/error-utils.cjs > "$gate_dir/error-utils.cjs"
          git show origin/main:scripts/release-pr-auth.cjs > "$gate_dir/release-pr-auth.cjs"
          node "$gate_dir/documentation-gate.cjs" --root "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --title "$PR_TITLE" \
            --author-type "$PR_AUTHOR_TYPE" \
            --labels "$PR_LABELS"

      - name: Validate plugin change routing
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_TITLE: ${{ github.event.pull_request.title || inputs.pr_title }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || inputs.pr_author_type }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') || inputs.pr_labels }}
        run: |
          set -euo pipefail
          contract_dir="$RUNNER_TEMP/release-contract"
          mkdir -p "$contract_dir"
          git fetch origin main
          git show origin/main:scripts/validate-release-contract.cjs > "$contract_dir/validate-release-contract.cjs"
          git show origin/main:scripts/marketplace-contract.cjs > "$contract_dir/marketplace-contract.cjs"
          git show origin/main:scripts/error-utils.cjs > "$contract_dir/error-utils.cjs"
          git show origin/main:scripts/release-pr-auth.cjs > "$contract_dir/release-pr-auth.cjs"
          node "$contract_dir/validate-release-contract.cjs" --root "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --title "$PR_TITLE" \
            --author-type "$PR_AUTHOR_TYPE" \
            --labels "$PR_LABELS"

      - name: Validate direct-push routing
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run validate:release-contract -- --base "$BASE_SHA" --head "$HEAD_SHA" --direct
