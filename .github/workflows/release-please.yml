name: Release plugin versions

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@12.0.2
          npm --version
      - name: Install dependencies
        run: HUSKY=0 npm ci
      - name: Validate release contract
        run: npm run validate:release-contract

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Set up Node.js for generated release pull requests
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository npm for generated release pull requests
        if: steps.release.outputs.prs_created == 'true'
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@12.0.2
          npm --version
      - name: Install dependencies for generated release pull requests
        if: steps.release.outputs.prs_created == 'true'
        run: HUSKY=0 npm ci
      - name: Format generated release pull requests
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          for number in $(node -e 'for (const pr of JSON.parse(process.env.RELEASE_PRS)) console.log(pr.number)'); do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$number")
            branch=$(node -p 'JSON.parse(process.argv[1]).head.ref' "$pr")
            git fetch origin "$branch"
            git switch --detach "origin/$branch"
            changelogs="$(git diff --name-only "origin/main...HEAD" -- "plugins/*/CHANGELOG.md")"
            if [[ -z "$changelogs" ]]; then
              echo "generated release pull request $number changes no plugin changelog" >&2
              exit 1
            fi
            npm exec prettier --write -- $changelogs
            if git diff --quiet -- $changelogs; then
              git switch --detach "$GITHUB_SHA"
              continue
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $changelogs
            git commit -m "chore(release): format generated changelog"
            commit_sha="$(git rev-parse HEAD)"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              -f sha="$commit_sha" \
              -F force=false
            git switch --detach "$GITHUB_SHA"
          done
      - name: Run quality for generated release pull requests
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          for number in $(node -e 'for (const pr of JSON.parse(process.env.RELEASE_PRS)) console.log(pr.number)'); do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$number")
            branch=$(node -p 'JSON.parse(process.argv[1]).head.ref' "$pr")
            base=$(node -p 'JSON.parse(process.argv[1]).base.sha' "$pr")
            head=$(node -p 'JSON.parse(process.argv[1]).head.sha' "$pr")
            title=$(node -p 'JSON.parse(process.argv[1]).title' "$pr")
            author_type=$(node -p 'JSON.parse(process.argv[1]).user.type' "$pr")
            labels=$(node -e 'for (const label of JSON.parse(process.argv[1]).labels) console.log(label.name)' "$pr" | paste -sd, -)
            gh workflow run quality.yml \
              --ref main \
              -f base_sha="$base" \
              -f head_sha="$head" \
              -f pr_title="$title" \
              -f pr_author_type="$author_type" \
              -f pr_labels="$labels" \
              -f checkout_ref="$branch"
          done
      - name: Verify releases contain no uploaded assets
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          set -euo pipefail
          node -e 'const paths=JSON.parse(process.env.PATHS_RELEASED); for (const path of paths) console.log(path)'
          for path in $(node -e 'for (const path of JSON.parse(process.env.PATHS_RELEASED)) console.log(path)'); do
            id=${path#plugins/}
            version=$(node -p "require('./plugins/' + process.argv[1] + '/.codex-plugin/plugin.json').version" "$id")
            assets=$(gh release view "plugin/$id/v$version" --json assets --jq '.assets | length')
            test "$assets" -eq 0
          done
