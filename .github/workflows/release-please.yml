name: Release plugin versions

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: HUSKY=0 npm ci
      - name: Validate release contract
        run: npm run validate:release-contract
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          command: manifest
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Verify releases contain no uploaded assets
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          set -euo pipefail
          node -e 'const paths=JSON.parse(process.env.PATHS_RELEASED); for (const path of paths) console.log(path)'
          for path in $(node -e 'for (const path of JSON.parse(process.env.PATHS_RELEASED)) console.log(path)'); do
            id=${path#plugins/}
            version=$(node -p "require('./plugins/' + process.argv[1] + '/.codex-plugin/plugin.json').version" "$id")
            assets=$(gh release view "plugin/$id/v$version" --json assets --jq '.assets | length')
            test "$assets" -eq 0
          done
